[project]
name = "wiki-knowledge"
version = "0.1.0"
description = "OpenCode install-time tooling for the wiki-knowledge plugin."
requires-python = ">=3.10"
# The runtime script layer is Go now (ADR-0011, #186). What remains here is
# install-time only — generate-opencode.py / install-opencode.py, which a
# person runs once to wire the plugin into an OpenCode vault.
dependencies = [
    "ruamel.yaml",     # round-trip agent/command frontmatter — NOT pyyaml (pyyaml coerces types / loses formatting)
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pyright",         # static type checking — run `<venv python> -m pyright` (#130)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
