name: tag-release

# Derives the release tag from wiki-plugin/.claude-plugin/plugin.json instead
# of relying on a human (or agent) to tag manually. The v0.8.0 release raced:
# a tag was pushed against a stale main before the version-bump PR (#197)
# merged, producing binaries that still reported 0.7.6. Tagging only here,
# gated on the tag not already existing, makes this the single place a
# release tag is created and ties it to the commit that actually carries the
# bumped version.
#
# GitHub Release creation is also inlined here (after the tag push) because
# fine-grained PATs cannot trigger downstream on:push workflows — the separate
# release.yml never fired. Classic PATs can trigger them, but relying on PAT
# flavour is fragile; inlining is simpler and self-contained.
#
# Bundle artifacts (wiki-plugin/scripts/ and skills/*/scripts/) are committed
# by a human via scripts/release.sh as part of the release PR. The freshness
# guard in ts-enchiridion.yml verifies them before merge; this workflow only
# creates the tag and GitHub Release after the verified commit lands on main.
on:
  push:
    branches: [main]
    paths:
      - wiki-plugin/.claude-plugin/plugin.json

permissions:
  contents: write

jobs:
  tag:
    name: Tag release from plugin.json version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(jq -r .version wiki-plugin/.claude-plugin/plugin.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag and push if new
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # RELEASE_GITHUB_TOKEN is a PAT (Contents: write on this repo).
          # Fine-grained PATs (like GITHUB_TOKEN) cannot trigger downstream
          # on:push workflows — that's why GitHub Release creation is inlined
          # here rather than delegated to a separate release.yml.
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          tag="v$VERSION"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "refs/tags/$tag$"; then
            echo "Tag $tag already exists on origin, skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/dhague/wiki-knowledge.git"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Create GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists, skipping."
            exit 0
          fi

          # Build per-skill ZIPs and attach to the release (#361).
          # Each ZIP has SKILL.md + scripts/ at the root — Joule Desktop's
          # expected structure for the ZIP install path.
          mkdir -p joule-desktop
          root_dir=$(pwd)
          for skill in wiki-retrieval wiki-ingest; do
            (cd "skills/${skill}" && zip -r "${root_dir}/joule-desktop/${skill}.zip" SKILL.md scripts/)
          done

          gh release create "$tag" --generate-notes \
            joule-desktop/wiki-retrieval.zip \
            joule-desktop/wiki-ingest.zip

      - name: Set up Python for npm package assembly
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python deps
        run: pip install ruamel.yaml

      - name: Assemble OpenCode npm package
        run: python wiki-plugin/scripts/assemble-opencode-package.py

      - name: Set up Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm (idempotent)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PUBLISHED=$(npm show "@dhague/wiki-knowledge@${VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "v$VERSION already published to npm, skipping."
          else
            cd wiki-plugin/opencode-npm && npm publish
          fi
