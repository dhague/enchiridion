name: tag-release

# Derives the release tag from wiki-plugin/.claude-plugin/plugin.json instead
# of relying on a human (or agent) to tag manually. The v0.8.0 release raced:
# a tag was pushed against a stale main before the version-bump PR (#197)
# merged, producing binaries that still reported 0.7.6. Tagging only here,
# gated on the tag not already existing, makes this the single place a
# release tag is created and ties it to the commit that actually carries the
# bumped version.
#
# GitHub Release creation is also inlined here (after the tag push) because
# fine-grained PATs cannot trigger downstream on:push workflows — the separate
# release.yml never fired. Classic PATs can trigger them, but relying on PAT
# flavour is fragile; inlining is simpler and self-contained.
#
# Joule skills bundle: this workflow also builds the TypeScript bundle and
# commits the output to skills/*/scripts/ so the AI Skills Library can fetch
# it directly from the repo. The RELEASE_GITHUB_TOKEN PAT must be allowed to
# push to protected main (add it to the branch protection bypass list). If
# it isn't, the "Commit Joule skills bundle" step will fail; the fallback is
# to include the bundle update manually in the release PR alongside the
# plugin.json version bump.
on:
  push:
    branches: [main]
    paths:
      - wiki-plugin/.claude-plugin/plugin.json

permissions:
  contents: write

jobs:
  tag:
    name: Tag release from plugin.json version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(jq -r .version wiki-plugin/.claude-plugin/plugin.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "refs/tags/$tag$"; then
            echo "Tag $tag already exists on origin, skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build TypeScript bundle
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          cd enchiridion-ts
          npm ci
          npm run build

      - name: Copy bundle to Joule skills directories
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          mkdir -p skills/wiki-retrieval/scripts skills/wiki-ingest/scripts
          cp enchiridion-ts/dist/cli.cjs skills/wiki-retrieval/scripts/enchiridion.cjs
          cp enchiridion-ts/dist/node-sqlite3-wasm.wasm skills/wiki-retrieval/scripts/
          cp enchiridion-ts/dist/cli.cjs skills/wiki-ingest/scripts/enchiridion.cjs
          cp enchiridion-ts/dist/node-sqlite3-wasm.wasm skills/wiki-ingest/scripts/

      - name: Commit Joule skills bundle
        if: steps.tag_check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/dhague/enchiridion.git"
          git add skills/wiki-retrieval/scripts/ skills/wiki-ingest/scripts/
          if git diff --cached --quiet; then
            echo "No bundle changes to commit."
          else
            git commit -m "ci: update Joule skills bundle for v${VERSION}"
            git push origin HEAD:main
          fi

      - name: Tag and push
        if: steps.tag_check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          tag="v$VERSION"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists, skipping."
            exit 0
          fi
          gh release create "$tag" --generate-notes
