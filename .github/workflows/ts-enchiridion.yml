name: ts-enchiridion

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    defaults:
      run:
        working-directory: enchiridion-ts
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # Always set up Node.js: npm ci and the esbuild step run under Node
      # regardless of which runtime this matrix leg is testing against.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build (esbuild bundle + wasm sidecar)
        run: npm run build

      - name: Test (Node.js)
        if: matrix.runtime == 'node'
        run: npm test

      - name: Test (Bun)
        if: matrix.runtime == 'bun'
        run: npm run test:bun

      - name: Smoke test the bundle prints usage and exits 0 (Node.js)
        if: matrix.runtime == 'node'
        run: node dist/cli.cjs

      - name: Smoke test the bundle prints usage and exits 0 (Bun)
        if: matrix.runtime == 'bun'
        run: bun dist/cli.cjs

  shim:
    name: Lint and test wiki-plugin/bin/enchiridion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install shellcheck and bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Lint the shim
        run: shellcheck -s sh wiki-plugin/bin/enchiridion

      - name: Test the shim
        run: bats wiki-plugin/tests/bin_enchiridion.bats

  version-check:
    name: Detect plugin version change vs main
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.compare.outputs.version_changed }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The freshness guard is a release-time safety net (D2 #287): it exists
      # to catch a release PR whose committed bundle drifted from a fresh
      # build. A release PR is exactly one that bumps plugin.json's version
      # (scripts/release.sh does both). On any other PR — a feature change
      # that touches enchiridion-ts/src/ without bumping the version — the
      # committed bundle is intentionally stale (refreshed only at release),
      # so comparing it to a fresh build would be a false alarm. Compare the
      # head's plugin version against the base branch's and report whether it
      # changed; the freshness job runs only when it did.
      - name: Compare plugin version to the base branch
        id: compare
        run: |
          head_version=$(jq -r .version wiki-plugin/.claude-plugin/plugin.json)
          base_ref="${GITHUB_BASE_REF:-main}"
          base_version=$(git show "origin/$base_ref:wiki-plugin/.claude-plugin/plugin.json" 2>/dev/null | jq -r .version || true)
          if [ "$head_version" != "$base_version" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "plugin version $head_version differs from base $base_version"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            echo "plugin version $head_version matches base $base_version"
          fi

  freshness:
    name: Verify committed bundle is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: version-check
    if: needs.version-check.outputs.version_changed == 'true'
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci
        working-directory: enchiridion-ts

      - name: Build (esbuild bundle + wasm sidecar)
        run: npm run build
        working-directory: enchiridion-ts

      # The shipped artifacts in wiki-plugin/scripts/ are committed by a human
      # via scripts/release.sh (D2 #287). This job rebuilds from source and
      # fails the PR if the committed bundle + wasm drift from a fresh build,
      # so a source change can never silently ship a stale artifact. Paths are
      # repo-root relative (fresh build output is enchiridion-ts/dist/).
      - name: Fail if committed artifacts differ from a fresh build
        run: |
          cmp wiki-plugin/scripts/cli.cjs enchiridion-ts/dist/cli.cjs
          cmp wiki-plugin/scripts/node-sqlite3-wasm.wasm enchiridion-ts/dist/node-sqlite3-wasm.wasm
