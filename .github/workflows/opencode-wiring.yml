name: opencode-wiring

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: OpenCode install-tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install ruamel.yaml pytest

      - name: Run tests
        working-directory: wiki-plugin
        run: python -m pytest

  validate:
    name: Validate OpenCode wiring
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENCODE_VERSION: "1.18.15"
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install script-layer deps
        run: pip install ruamel.yaml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Typecheck OpenCode wiring plugins
        working-directory: wiki-plugin/wiring/opencode
        run: npm ci && npm run typecheck

      - name: Install OpenCode (pinned)
        run: curl -fsSL https://opencode.ai/install | bash -s -- --version "$OPENCODE_VERSION"

      - name: Install plugin wiring into a throwaway vault
        run: |
          set -euo pipefail
          VAULT="$RUNNER_TEMP/wiki-vault"
          mkdir -p "$VAULT"
          python - "$RUNNER_TEMP" "$VAULT" <<'PY'
          import json
          import sys
          runner_temp, vault = sys.argv[1:3]
          # Throwaway model-mapping config: both canonical models -> the openai
          # provider, whose baseURL the CI job points at the local mock server.
          with open(f"{runner_temp}/mock-models.json", "w") as f:
              json.dump({"sonnet": "openai/gpt-4o-mini",
                         "haiku": "openai/gpt-4o-mini"}, f)
          # A pre-existing opencode.json carrying the mock provider; the
          # installer merges skills.paths in without clobbering it.
          with open(f"{vault}/opencode.json", "w") as f:
              json.dump({
                  "$schema": "https://opencode.ai/config.json",
                  "model": "openai/gpt-4o-mini",
                  "small_model": "openai/gpt-4o-mini",
                  "provider": {
                      "openai": {
                          "options": {
                              "baseURL": "http://127.0.0.1:8799/v1",
                              "apiKey": "sk-mock",
                          }
                      }
                  },
              }, f, indent=2)
          PY
          # install-opencode.py runs generate-opencode.py itself with the
          # throwaway config, then deploys agents/commands/marker/plugin into
          # the vault's .opencode/ and merges skills.paths into opencode.json.
          # Run it from inside the vault so the generated tree lands there.
          (cd "$VAULT" && python "$GITHUB_WORKSPACE/wiki-plugin/scripts/install-opencode.py" \
            --plugin-root "$GITHUB_WORKSPACE/wiki-plugin" \
            --model-config "$RUNNER_TEMP/mock-models.json")
          echo "VAULT=$VAULT" >> "$GITHUB_ENV"
          echo "Generated artifacts:"
          ls -1 "$VAULT/.opencode/agents" "$VAULT/.opencode/commands"

      - name: Verify plugin surfaces against the mock model
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/.github/scripts/mock-opencode-model.py" &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8799/health >/dev/null 2>&1; then
              echo "mock server up after ${i}s"
              break
            fi
            if [ "$i" = 30 ]; then
              echo "mock server failed to start" >&2
              exit 1
            fi
            sleep 1
          done
          cd "$VAULT"

          echo "== agents registerable =="
          "$HOME/.opencode/bin/opencode" agent list | grep -E "^wiki-(ingest|researcher) \(subagent\)"

          echo "== skills discoverable =="
          "$HOME/.opencode/bin/opencode" debug skill > "$RUNNER_TEMP/skills.json"
          python - "$RUNNER_TEMP/skills.json" <<'PY'
          import json, sys
          names = {s.get("name") for s in json.load(open(sys.argv[1]))}
          need = {"wiki-conventions", "wiki-ingest", "wiki-init",
                  "wiki-ask", "wiki-watch", "save-conversation"}
          missing = need - names
          assert not missing, f"missing skills: {sorted(missing)}"
          print("all wiki skills discoverable:", ", ".join(sorted(need)))
          PY

          echo "== commands invocable =="
          "$HOME/.opencode/bin/opencode" run --format json "/wiki-conventions" > "$RUNNER_TEMP/run.json"
          grep -q '"reason":"stop"' "$RUNNER_TEMP/run.json"
          echo "command run produced a clean step_finish"

          # Subagent skill-load check (#333): the mock emits a `skill`
          # function_call turn when a request offers the skill tool and its
          # newest message carries the trigger, so this run makes the
          # wiki-ingest subagent actually attempt to load wiki-conventions.
          # The assertion inspects the subagent session's transcript: a
          # generated agent with `skill: allow` executes the call (status
          # completed, output carries the SKILL.md content); a `skill: deny`
          # agent is never even offered the tool, so no skill part exists and
          # the assertion fails. This is the check the text-only mock could
          # not make — the permission gate is exercised, not just the
          # Build-agent command path.
          echo "== subagent skill load =="
          "$HOME/.opencode/bin/opencode" run --format json --command wiki-ingest "__CALL_SKILL__ load the wiki-conventions skill" > "$RUNNER_TEMP/subagent.json"
          python - "$HOME/.opencode/bin/opencode" "$RUNNER_TEMP/subagent.json" <<'PY'
          import json
          import subprocess
          import sys

          opencode, run_path = sys.argv[1:3]

          def export(session_id: str) -> dict:
              result = subprocess.run(
                  [opencode, "export", session_id],
                  capture_output=True, text=True, check=True,
              )
              return json.loads(result.stdout)

          # The run's own session id — every emitted event carries it.
          events = [json.loads(line) for line in open(run_path) if line.strip()]
          parent_id = events[0]["sessionID"]

          # The harness dispatches a subagent command via the task tool, which
          # lives in the parent session and records the subagent session id in
          # its state metadata.
          parent = export(parent_id)
          child_id = None
          for msg in parent["messages"]:
              for part in msg["parts"]:
                  if part.get("type") == "tool" and part.get("tool") == "task":
                      child_id = part["state"]["metadata"]["sessionId"]
          assert child_id, "no task tool part recording the subagent session id"

          # The skill tool execution happens inside the subagent session.
          child = export(child_id)
          skill_parts = [
              part
              for msg in child["messages"]
              for part in msg["parts"]
              if part.get("type") == "tool" and part.get("tool") == "skill"
          ]
          assert skill_parts, "subagent never attempted the skill tool"
          completed = [p for p in skill_parts if p["state"]["status"] == "completed"]
          assert completed, "skill tool not allowed/executed (permission denied?)"
          output = completed[0]["state"]["output"]
          assert "# Skill: wiki-conventions" in output, (
              "skill output missing the wiki-conventions SKILL.md content"
          )
          print("subagent loaded the wiki-conventions skill via the skill tool")
          PY

      - name: Assert no generated files committed
        run: |
          test -z "$(git status --porcelain)" \
            || { echo "working tree dirty — generated files leaked into the repo:"; git status --porcelain; exit 1; }
          echo "working tree clean — no generated artifacts committed"
